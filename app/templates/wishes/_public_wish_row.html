<div id="wish-{{ wish.id }}"
     class="group bg-white border border-gray-200 rounded-xl p-4 flex items-center gap-4
	    shadow-sm hover:shadow-md transition">

	<div class="flex-1">

		<div class="flex items-center gap-2">

			{% if wish.purchased %}
			<span class="line-through text-gray-500 font-semibold">
				<a href="{{ wish.link }}" class="hover:text-purple-600">
					{{ wish.title }}
				</a>
			</span>
			{% else %}
			<a href="{{ wish.link }}"
			   class="font-semibold text-gray-900 hover:text-purple-600">
				{{ wish.title }}
			</a>
			{% endif %}

		</div>

		{% if wish.note %}
		<p class="text-sm text-gray-500 mt-1">
		{{ wish.note }}
		</p>
		{% endif %}

	</div>

	<div class="flex items-center gap-2">

		{% if not wish.purchased %}

		<button
				type="button"
				hx-post="{{ url_for('purchase_wish', user_id=user.id, wish_id=wish.id) }}"
				hx-target="#wish-{{ wish.id }}"
				hx-swap="outerHTML"
				hx-confirm="Are you sure you want to mark this wishlist item as purchased?"
				class="text-sm bg-purple-600 hover:bg-purple-800 text-white px-3 py-1 rounded-md"
				>
				Mark Purchased
		</button>

			{% else %}

			<span class="text-green-600 text-sm font-semibold mr-2">
				Purchased
			</span>

			<button
					type="button"
					hx-post="{{ url_for('unpurchase_wish', user_id=user.id, wish_id=wish.id) }}"
					hx-target="#wish-{{ wish.id }}"
					hx-swap="outerHTML"
					class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1 rounded-md"
					>
					Undo
			</button>

				{% endif %}

	</div>

</div>
