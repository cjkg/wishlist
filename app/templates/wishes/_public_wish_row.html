<tr>
    <td>
        {% if wish.purchased %}
            <span class="line-through text-gray-500">
                <a href="{{ wish.link }}">{{ wish.title }}</a>
            </span>
        {% else %}
            <a href="{{ wish.link }}">{{ wish.title }}</a>
        {% endif %}
    </td>

    <td>
        {% if not wish.purchased %}
        <button
            type="button"
            hx-post="{{ url_for('purchase_wish', user_id=user.id, wish_id=wish.id) }}"
            hx-target="closest tr"
            hx-swap="outerHTML"
	    hx-confirm="Are you sure you want to mark this wishlist item as purchased?"
            class="bg-purple-500 hover:bg-purple-700 text-white font-bold py-2 px-2 rounded"
        >
            Mark as Purchased
        </button>
        {% else %}
        <span class="text-green-600 font-semibold">Purchased</span>
        {% endif %}
    </td>
</tr>
