<span class="font-semibold text-gray-700">

	<span class="flex px-2 py-1 rounded bg-green-100 text-green-700 text-sm items-center">
        	Purchased!
	</span>
    {% else %}
	<span class="flex px-2 py-1 rounded bg-gray-200 text-gray-700 text-sm items-center">
    		Unpurchased
	</span>
    {% endif %}
</span>
