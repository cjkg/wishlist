<div id="wish-{{ wish.id }}"
     class="bg-white border border-gray-200 rounded xl p-4">

<form
	hx-post="{{ url_for('update_wish', wish_id=wish.id) }}"
	hx-target="#wish-{{ wish.id }}"
	hx-swap="outerHTML"
	class="space-y-2"
>
	{{ form.hidden_tag() }}

	{{ form.title(class="w-full border rounded-md px-3 py-2") }}
    	{{ form.note(class="w-full border rounded-md px-3 py-2") }}
    	{{ form.link(class="w-full border rounded-md px-3 py-2") }}

	<div class="flex gap-2 justify-end">
        <button
            hx-get="{{ url_for('update_wish', wish_id=wish.id) }}"
            hx-target="#wish-{{ wish.id }}"
            hx-swap="outerHTML"
            type="button"
            class="text-sm bg-gray-200 px-3 py-1 rounded-md">
            Cancel
        </button>

        {{ form.submit(class="text-sm bg-purple-600 text-white px-3 py-1 rounded-md") }}
    </div>
</form>

</div>
