<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="{{url_for('static',filename='dist/output.css')}}">
	</head>
	<title>Simple Wishlist</title>
	</head>
	<body class="bg-gray-50">

		<nav class="sticky top-0 bg-white border-b border-gray-200 z-40">
			<div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">

				<div class="text-purple-600 font-semibold text-lg">
					simple wishlist
				</div>

				<div class="flex items-center gap-4 text-sm">
					<a href="{{ url_for('index') }}"
					   class="text-gray-700 hover:text-purple-600">
						home
					</a>

					{% if current_user.is_anonymous %}
					<a href="{{ url_for('login') }}"
					   class="text-gray-700 hover:text-purple-600">
						login
					</a>
					{% else %}
					<a href="{{ url_for('logout') }}"
					   class="text-gray-700 hover:text-purple-600">
						logout
					</a>
					{% endif %}
				</div>

			</div>
		</nav>

		{% with messages = get_flashed_messages() %}
		{% if messages %}
		<div class="max-w-5xl mx-auto px-4 mt-4">
			{% for message in messages %}
			<div class="bg-white border border-gray-200 rounded-md px-4 py-2 text-sm shadow-sm">
				{{ message }}
			</div>
			{% endfor %}
		</div>
		{% endif %}
		{% endwith %}

		{% block content %}{% endblock %}
</html>
